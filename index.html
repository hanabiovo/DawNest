<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213a">
<title>鸦巢</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<style>
:root{
  --ink:#0e1729;--bg:#152238;--fg:#efe9dc;--soft:rgba(239,233,220,.72);--mute:rgba(239,233,220,.46);
  --glass:rgba(255,255,255,.055);--glass-2:rgba(255,255,255,.085);--rim:rgba(255,255,255,.10);
  --hi:rgba(255,255,255,.16);--cream:#ede6d6;--ok:#9fd3b0;--bad:#f0a29a;
  --r-lg:26px;--r-md:16px;--r-sm:12px;
  --blur:saturate(150%) blur(28px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{margin:0;min-height:100vh;color:var(--fg);background:var(--ink);
  font:15px/1.6 -apple-system,system-ui,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:.01em}
/* 背景光斑：毛玻璃要有东西可以模糊 */
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38vmax 38vmax at 82% 8%,rgba(237,230,214,.26),transparent 60%),
    radial-gradient(46vmax 46vmax at 6% 72%,rgba(88,138,190,.42),transparent 62%),
    radial-gradient(30vmax 30vmax at 70% 92%,rgba(160,120,180,.24),transparent 60%),
    linear-gradient(180deg,#14213a 0%,#0e1729 100%);
  filter:blur(8px)}
main{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 22px calc(48px + env(safe-area-inset-bottom))}

header{display:flex;align-items:flex-end;justify-content:space-between;margin:12px 4px 30px}
h1{margin:0;font-weight:600;font-size:30px;line-height:1.1;letter-spacing:.18em;
  font-family:"Songti SC","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC",serif}
h1 small{display:block;margin-top:10px;font:500 10.5px/1 -apple-system,system-ui,sans-serif;
  letter-spacing:.34em;text-transform:uppercase;color:var(--mute)}

button{font:inherit;color:var(--fg);background:none;border:0;cursor:pointer;transition:transform .18s var(--ease),background .2s}
button:active{transform:scale(.96)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass);border:1px solid var(--rim);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--hi)}
.icon-btn svg{width:19px;height:19px;stroke:var(--soft)}

.glass{position:relative;background:var(--glass);border:1px solid var(--rim);border-radius:var(--r-lg);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--hi),0 20px 50px -24px rgba(0,0,0,.55)}
.card{padding:22px 20px;margin-top:18px}

.drop{display:flex;flex-direction:column;align-items:center;gap:14px;padding:44px 20px 40px;text-align:center;cursor:pointer;
  transition:background .25s,border-color .25s}
.drop.on{background:var(--glass-2);border-color:rgba(237,230,214,.35)}
.drop .bird{width:84px;height:auto;margin-bottom:4px;
  filter:drop-shadow(0 10px 24px rgba(237,230,214,.28));transform-origin:30% 80%;transition:transform .5s var(--ease)}
.drop:active .bird,.drop.on .bird{transform:rotate(-8deg) translateY(-3px)}
.drop b{font-weight:500;font-size:17px;letter-spacing:.12em}
.drop span{font-size:12.5px;color:var(--mute);letter-spacing:.04em}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
.sec h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.28em;color:var(--mute)}
.link{font-size:12.5px;color:var(--soft);padding:4px 0 4px 14px}
.link:hover{color:var(--fg)}

.item{display:flex;gap:14px;align-items:center;padding:14px 0}
.item+.item{border-top:1px solid rgba(255,255,255,.06)}
.thumb{width:52px;height:52px;border-radius:var(--r-sm);object-fit:cover;flex:none;background:rgba(255,255,255,.04);
  box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.meta{flex:1;min-width:0}
.name{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11.5px;color:var(--mute);margin-top:2px;letter-spacing:.03em}
.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}
.bar{height:2px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(237,230,214,.5),var(--cream));transition:width .4s var(--ease)}
.st.ok~.bar{opacity:0;transition:opacity .6s .4s}
.acts{display:flex;gap:6px;flex:none}
.acts button,.pill{padding:6px 13px;font-size:12px;border-radius:999px;background:var(--glass-2);border:1px solid var(--rim);color:var(--soft)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r-md);cursor:pointer;background:rgba(255,255,255,.04);
  box-shadow:0 0 0 1px rgba(255,255,255,.07);transition:transform .25s var(--ease),filter .25s}
.grid img:active{transform:scale(.96);filter:brightness(1.15)}
.empty{font-size:12.5px;color:var(--mute);padding:18px 2px 4px;letter-spacing:.04em}

/* 设置：底部抽屉 */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(6,10,20,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .25s}
#cfg.hidden+.scrim{display:none}
#cfg{position:fixed;z-index:21;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:88vh;overflow:auto;
  padding:10px 24px calc(28px + env(safe-area-inset-bottom));border-radius:30px 30px 0 0;border-bottom:0;
  background:rgba(24,36,60,.72);animation:rise .35s var(--ease)}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:4px auto 18px}
.sheet-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sheet-h h3{margin:0;font-size:18px;font-weight:500;letter-spacing:.2em}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

label{display:block;font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--mute);margin:20px 2px 8px}
input,select{width:100%;font:inherit;font-size:15px;color:var(--fg);background:rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.08);border-radius:var(--r-sm);padding:12px 14px;outline:none;
  transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
input::placeholder{color:rgba(239,233,220,.28)}
input:focus,select:focus{border-color:rgba(237,230,214,.45);box-shadow:0 0 0 4px rgba(237,230,214,.08)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
select option{background:#1a2740}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.check{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;
  font-size:14px;letter-spacing:.02em;color:var(--fg);text-transform:none;font-weight:400}
.check input{width:44px;height:26px;padding:0;border-radius:999px;background:rgba(255,255,255,.12);position:relative;flex:none;cursor:pointer;border:0}
.check input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .25s var(--ease)}
.check input:checked{background:var(--cream)}
.check input:checked::after{transform:translateX(18px);background:var(--ink)}
details{margin-top:14px;border-top:1px solid rgba(255,255,255,.06);padding-top:6px}
summary{font-size:13px;color:var(--soft);cursor:pointer;padding:10px 2px;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"＋";color:var(--mute)}
details[open] summary::after{content:"－"}
summary::-webkit-details-marker{display:none}
.hint{font-size:12px;color:var(--mute);margin:10px 2px 0;line-height:1.7}
#detect.ok{color:var(--ok)}#detect.bad{color:var(--bad)}
.toolbar{display:flex;gap:10px;margin-top:28px}
.primary{flex:1;padding:14px;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:600;letter-spacing:.2em;
  box-shadow:0 12px 28px -12px rgba(237,230,214,.5)}
.secondary{padding:14px 20px;border-radius:999px;background:var(--glass-2);border:1px solid var(--rim);color:var(--soft);letter-spacing:.08em}

#toast{position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));z-index:30;transform:translate(-50%,16px);
  padding:10px 20px;border-radius:999px;font-size:13px;letter-spacing:.06em;color:var(--fg);
  background:rgba(30,44,70,.7);border:1px solid var(--rim);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--hi),0 16px 40px -16px rgba(0,0,0,.6);opacity:0;transition:.3s var(--ease);pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,#cfg{background:rgba(28,42,68,.94)}}
</style>
</head>
<body>
<main>
  <header>
    <h1>鸦巢<small>Daw's Nest</small></h1>
    <button class="icon-btn" id="toggleCfg" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>

  <section class="glass hidden" id="cfg">
    <div class="grab"></div>
    <div class="sheet-h"><h3>设置</h3><button class="link" id="closeCfg">完成</button></div>
    <label>访问令牌</label>
    <input id="token" type="password" placeholder="粘贴 github_pat_… 后会自动识别仓库" autocomplete="off">
    <div class="hint" id="detect">只需要填令牌，其余自动识别。</div>
    <details id="adv">
      <summary>仓库信息 · 一般不用动</summary>
      <div class="row">
        <div><label>用户名 / 组织</label><input id="owner" autocapitalize="off" autocomplete="off"></div>
        <div><label>仓库</label><input id="repo" list="repoList" autocapitalize="off" autocomplete="off"><datalist id="repoList"></datalist></div>
      </div>
      <div class="row">
        <div><label>分支</label><input id="branch" placeholder="main" autocapitalize="off"></div>
        <div><label>图片目录</label><input id="dir" placeholder="img" autocapitalize="off"></div>
      </div>
    </details>
    <label>链接格式</label>
    <select id="linkType">
      <option value="raw">raw.githubusercontent.com（原始）</option>
      <option value="jsd">jsDelivr CDN</option>
      <option value="custom">自定义前缀</option>
    </select>
    <input id="prefix" class="hidden" style="margin-top:8px" placeholder="https://img.example.com/" autocapitalize="off">
    <label class="check">上传前压缩为 WebP<input type="checkbox" id="compress"></label>
    <div class="row" id="cmpOpts">
      <div><label>最长边 px</label><input id="maxSide" type="number" placeholder="2400"></div>
      <div><label>质量 0–1</label><input id="quality" type="number" step="0.05" placeholder="0.85"></div>
    </div>
    <div class="toolbar">
      <button class="primary" id="save">保 存</button>
      <button class="secondary" id="test">测试连接</button>
    </div>
    <div class="hint">令牌用 Fine-grained token：只勾存图的仓库，权限只给 Contents: Read and write。令牌只存在这台手机上。</div>
  </section>
  <div class="scrim" id="scrim"></div>

<script>
const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) }catch{ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} }
};
const FIELDS = ['owner','repo','branch','dir','token','linkType','prefix','maxSide','quality'];
let cfg = LS.get('cfg', {});

function loadCfg(){
  FIELDS.forEach(f => $('#'+f).value = cfg[f] ?? '');
  if(!cfg.linkType) $('#linkType').value = 'raw';
  if(!cfg.owner){ const g = guessFromHost(); if(g.owner){ $('#owner').value = g.owner; $('#repo').value = g.repo; } }
  if(cfg.owner) setDetect(`当前：${cfg.owner}/${cfg.repo} · ${cfg.branch || 'main'}`, 'ok');
  $('#compress').checked = !!cfg.compress;
  syncCfgUI();
  if(!cfg.owner || !cfg.repo || !cfg.token) $('#cfg').classList.remove('hidden');
}
function readCfg(){
  const c = {};
  FIELDS.forEach(f => c[f] = $('#'+f).value.trim());
  c.compress = $('#compress').checked;
  c.branch ||= 'main';
  c.dir = (c.dir || 'img').replace(/^\/+|\/+$/g,'');
  return c;
}
function syncCfgUI(){
  $('#prefix').classList.toggle('hidden', $('#linkType').value !== 'custom');
  $('#cmpOpts').classList.toggle('hidden', !$('#compress').checked);
}
// ---- 自动识别：从网址猜仓库，从令牌拉可写仓库和默认分支 ----
function guessFromHost(){
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if(!m) return {};
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return { owner: m[1], repo: seg || `${m[1]}.github.io` };
}
function setDetect(t, cls){ const d = $('#detect'); d.textContent = t; d.className = 'hint ' + (cls || ''); }
async function autodetect(){
  const token = $('#token').value.trim();
  if(!token) return;
  setDetect('识别中…');
  try{
    const r = await gh({ token }, '/user/repos?per_page=100&sort=updated');
    if(!r.ok) throw new Error(await errText(r));
    const repos = (await r.json()).filter(x => !x.permissions || x.permissions.push);
    if(!repos.length) throw new Error('这个令牌没有任何可写的仓库');
    $('#repoList').innerHTML = repos.map(x => `<option value="${x.name}">`).join('');
    // 注意：GitHub 返回的 push 权限是"你本人"的，不是令牌的，所以不能靠它判断。
    // 鸦巢自己所在的仓库几乎不会拿来存图，排到最后。
    const g = guessFromHost(); const self = `${g.owner}/${g.repo}`.toLowerCase();
    const cur = `${$('#owner').value}/${$('#repo').value}`.toLowerCase();
    const notSelf = repos.filter(x => x.full_name.toLowerCase() !== self);
    const pick = (cur !== self && repos.find(x => x.full_name.toLowerCase() === cur))
              || notSelf[0] || repos[0];
    $('#owner').value = pick.owner.login; $('#repo').value = pick.name;
    $('#branch').value = pick.default_branch || 'main';
    if(!$('#dir').value) $('#dir').value = 'img';
    const more = repos.length > 1 ? `（令牌能写 ${repos.length} 个仓库，要换就展开下面改）` : '';
    setDetect(`✓ ${pick.full_name} · ${$('#branch').value}${pick.private ? ' · 注意：私有仓库，外链别人打不开' : ''}${more}`, pick.private ? 'bad' : 'ok');
  }catch(e){ setDetect('识别失败：' + e.message, 'bad'); }
}
$('#token').addEventListener('change', autodetect);
$('#token').addEventListener('paste', () => setTimeout(autodetect, 50));
$('#linkType').onchange = syncCfgUI;
$('#compress').onchange = syncCfgUI;
$('#toggleCfg').onclick = () => $('#cfg').classList.toggle('hidden');
$('#scrim').onclick = $('#closeCfg').onclick = () => $('#cfg').classList.add('hidden');
$('#save').onclick = async () => { if(!$('#owner').value || !$('#repo').value) await autodetect(); cfg = readCfg(); if(!cfg.owner || !cfg.repo || !cfg.token) return toast('还缺令牌'); LS.set('cfg', cfg); toast('已保存'); $('#cfg').classList.add('hidden'); };
$('#test').onclick = async () => {
  const c = readCfg();
  try{
    const r = await gh(c, `/repos/${c.owner}/${c.repo}`);
    if(!r.ok) throw new Error(await errText(r));
    const j = await r.json();
    if(j.private) toast('连上了，但仓库是私有的：raw 外链别人打不开');
    else if(j.permissions && !j.permissions.push) toast('能读不能写，令牌权限不够');
    else toast('连上了，可以写');
  }catch(e){ toast('失败：' + e.message) }
};

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200);
}

function gh(c, path, opt = {}, ms = 90000){
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), ms);
  return fetch('https://api.github.com' + path, {
    ...opt, signal: ctl.signal,
    headers: { 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json',
               'X-GitHub-Api-Version': '2022-11-28', ...(opt.headers || {}) }
  }).finally(() => clearTimeout(tm));
}
async function errText(r){
  let m = ''; try{ m = (await r.json()).message }catch{}
  const map = {401:'令牌无效或过期', 403:'没权限（或触发限流）', 404:'找不到仓库/分支，或令牌看不到它', 409:'分支冲突', 422:'同名文件已存在'};
  if(/not accessible by personal access token/i.test(m)) return '令牌没有这个仓库的写入权限';
  return `${r.status} ${map[r.status] || ''} ${m}`.trim();
}

const pad = n => String(n).padStart(2,'0');
function makePath(c, ext){
  const d = new Date();
  const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  const rnd = Math.random().toString(36).slice(2,6);
  return `${c.dir}/${d.getFullYear()}/${pad(d.getMonth()+1)}/${stamp}-${rnd}.${ext}`;
}
function linkFor(c, path){
  const p = path.split('/').map(encodeURIComponent).join('/');
  if(c.linkType === 'jsd') return `https://cdn.jsdelivr.net/gh/${c.owner}/${c.repo}@${c.branch}/${p}`;
  if(c.linkType === 'custom' && c.prefix) return c.prefix.replace(/\/?$/,'/') + p;
  return `https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch}/${p}`;
}
const extOf = f => (f.type.split('/')[1] || f.name.split('.').pop() || 'png').replace('jpeg','jpg').replace('svg+xml','svg').toLowerCase();

async function compress(c, file){
  if(!c.compress || /gif|svg/.test(file.type)) return file;
  const max = +c.maxSide || 2400, q = +c.quality || 0.85;
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/webp', q));
  return blob && blob.size < file.size ? new File([blob], 'x.webp', { type: 'image/webp' }) : file;
}
const toB64 = blob => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(fr.result.slice(fr.result.indexOf(',') + 1));
  fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob);
});

// ---- 队列：串行上传，避免并发提交互相冲突 ----
const jobs = []; let running = false;

function addFiles(list){
  const files = [...list].filter(f => f.type.startsWith('image/'));
  if(!files.length) return;
  cfg = LS.get('cfg', {});
  if(!cfg.owner || !cfg.repo || !cfg.token){ $('#cfg').classList.remove('hidden'); toast('先填设置'); return; }
  $('#queueCard').classList.remove('hidden');
  files.forEach(f => {
    const job = { file: f, el: renderJob(f), url: '' };
    jobs.push(job); job.state = 'wait';
  });
  pump();
}
function renderJob(f){
  const el = document.createElement('div'); el.className = 'item';
  el.innerHTML = `<img class="thumb"><div class="meta"><div class="name"></div><div class="st">排队中</div><div class="bar"><i></i></div></div><div class="acts"></div>`;
  el.querySelector('.thumb').src = URL.createObjectURL(f);
  el.querySelector('.name').textContent = f.name || '粘贴的图片';
  $('#queue').prepend(el); return el;
}
function setJob(job, text, cls, pct){
  const st = job.el.querySelector('.st'); st.textContent = text; st.className = 'st ' + (cls || '');
  if(pct != null) job.el.querySelector('.bar i').style.width = pct + '%';
}
async function pump(){
  if(running) return; running = true;
  let job;
  while((job = jobs.find(j => j.state === 'wait'))){ job.state = 'run'; await upload(job); }
  running = false;
}
async function upload(job){
  const c = cfg;
  try{
    setJob(job, '处理中…', '', 15);
    const blob = await compress(c, job.file);
    const b64 = await toB64(blob);
    let tries = 0;
    while(true){
      tries++;
      const path = makePath(c, extOf(blob));
      setJob(job, tries > 1 ? `重试第 ${tries - 1} 次…` : '上传中…', '', 55);
      const r = await gh(c, `/repos/${c.owner}/${c.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`, {
        method: 'PUT',
        body: JSON.stringify({ message: `upload ${path.split('/').pop()}`, content: b64, branch: c.branch })
      });
      if(r.ok){
        job.url = linkFor(c, path); job.state = 'done';
        setJob(job, `完成 · ${(blob.size/1024).toFixed(0)} KB`, 'ok', 100);
        job.el.querySelector('.acts').innerHTML = `<button data-a="url">链接</button><button data-a="md">MD</button>`;
        job.el.querySelector('.acts').onclick = e => {
          const a = e.target.dataset.a; if(a) copy(a === 'md' ? md(job.url) : job.url);
        };
        pushHist({ url: job.url, path, t: Date.now() });
        if(jobs.filter(j => j.state === 'wait' || j.state === 'run').length === 1) copy(job.url, true);
        return;
      }
      // 409 分支被别的提交抢先；422 同名；5xx 服务器抽风 —— 都值得再来
      if((r.status === 409 || r.status === 422 || r.status >= 500) && tries < 4){
        await new Promise(s => setTimeout(s, 800 * tries)); continue;
      }
      throw new Error(await errText(r));
    }
  }catch(e){
    job.state = 'fail';
    const msg = e.name === 'AbortError' ? '超时（切后台或网络慢）' : (e.message || '网络错误');
    setJob(job, '失败：' + msg, 'bad', 0);
    const acts = job.el.querySelector('.acts');
    acts.innerHTML = `<button>重试</button>`;
    acts.onclick = () => { acts.innerHTML = ''; job.state = 'wait'; setJob(job, '排队中', '', 0); pump(); };
  }
}

const md = u => `![](${u})`;
async function copy(text, silent){
  try{ await navigator.clipboard.writeText(text); }
  catch{
    const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(silent ? '上传完成，链接已复制' : '已复制');
}
$('#copyAllUrl').onclick = () => { const u = jobs.filter(j => j.url).map(j => j.url); u.length ? copy(u.join('\n')) : toast('还没有完成的') };
$('#copyAllMd').onclick = () => { const u = jobs.filter(j => j.url).map(j => md(j.url)); u.length ? copy(u.join('\n')) : toast('还没有完成的') };

// ---- 历史 ----
function pushHist(h){ const a = LS.get('hist', []); a.unshift(h); LS.set('hist', a.slice(0, 80)); renderHist(); }
function renderHist(){
  const a = LS.get('hist', []); const g = $('#hist'); g.innerHTML = '';
  $('#histEmpty').classList.toggle('hidden', a.length > 0);
  a.forEach(h => {
    const im = document.createElement('img'); im.loading = 'lazy'; im.src = h.url; im.alt = h.path;
    im.onclick = () => copy(h.url);
    im.oncontextmenu = e => { e.preventDefault(); copy(md(h.url)); };
    g.append(im);
  });
}
$('#clearHist').onclick = () => { LS.set('hist', []); renderHist(); toast('记录清了（仓库里的图还在）'); };

// ---- 入口：点选 / 拖放 / 粘贴 / 分享 ----
const drop = $('#drop');
drop.onclick = () => $('#file').click();
$('#file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
drop.ondragleave = () => drop.classList.remove('on');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('on'); addFiles(e.dataTransfer.files); };
addEventListener('paste', e => addFiles([...e.clipboardData.items].map(i => i.getAsFile()).filter(Boolean)));

async function takeShared(){
  if(!location.search.includes('shared')) return;
  history.replaceState(null, '', './');
  const cache = await caches.open('yachao-share');
  const keys = await cache.keys(); const files = [];
  for(const k of keys){
    const r = await cache.match(k); const b = await r.blob();
    files.push(new File([b], decodeURIComponent(r.headers.get('x-name') || 'image'), { type: b.type }));
    await cache.delete(k);
  }
  addFiles(files);
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
loadCfg(); renderHist(); takeShared();
</script>
